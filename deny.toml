# cargo-deny gate (CI job "cargo-deny"):  cargo deny check
# Only what ships counts: the Windows target and the three Android targets, no dev-dependencies.
[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]
exclude-dev = true

[licenses]
# Allow-list compatible with distributing Kiwi Transfer under Apache-2.0: permissive licences only
# (same list as the other FastKiwi repositories). No GPL, LGPL, AGPL, MPL or SSPL; adding a licence
# or an exception needs the owner's approval.
#   - Unicode-3.0 covers Unicode data tables (unicode-ident and friends).
#   - An SPDX `OR` expression is accepted when one of its branches is on this list.
#   - JNA (Android side, a Maven artifact that cargo-deny never sees) is LGPL-2.1-or-later OR
#     Apache-2.0: we use it under Apache-2.0, and record that choice in NOTICE and the SBOM at release.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The allow-list is shared across the FastKiwi repositories; not every entry is used here.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# TLS is rustls with the ring provider only (spike decision): no OpenSSL, no aws-lc.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "aws-lc-rs" },
  { name = "aws-lc-sys" },
]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
